---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  {% if page.author %}
  <div class="entry-item-meta">by {{ page.author }}</div>
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  {% if page.category == 'book' %}
    <p><a href="{{ site.baseurl }}/books/" class="read-more">&larr; All Books</a></p>
  {% else %}
    <p><a href="{{ site.baseurl }}/" class="read-more">&larr; All Posts</a></p>
  {% endif %}

  <!--{% include disqus.html %}-->
</article>

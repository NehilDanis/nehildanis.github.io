---
layout: default
---

<article class="paper">
  <h1>{{ page.title }}</h1>

  {% if page.authors %}
  <div class="entry-item-meta">{{ page.authors }}</div>
  {% endif %}

  {% if page.link %}
  <p><a href="{{ page.link }}" class="read-more">Original Paper</a></p>
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  <p><a href="{{ site.baseurl }}/papers/" class="read-more">&larr; All Papers</a></p>
</article>

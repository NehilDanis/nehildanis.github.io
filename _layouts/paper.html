---
layout: default
---

<article class="paper">
  <h1>{{ page.title }}</h1>

  {% if page.authors %}
  <div class="authors">{{ page.authors }}</div>
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

</article>
